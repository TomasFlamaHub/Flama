# =====================================================================
#  CENTRO DE CONTROL COMERCIAL - CONFIGURACIÓN PRINCIPAL
#  Todo lo que dice COMPLETAR debe llenarse con datos reales del negocio.
# =====================================================================

business:
  name: "Mi Negocio"                 # COMPLETAR
  timezone: "America/Santiago"
  currency: "CLP"
  # Hora de corte del día comercial. Un pedido de las 00:40 cuenta para el día
  # anterior si el corte es a las 05:00. Así la comparación "lunes vs lunes" es homogénea.
  business_day_cutoff_hour: 5
  # Qué número se usa como "venta" principal en tarjetas y alertas:
  #   gross = venta bruta (precio de menú, antes de descuentos)
  #   net   = venta neta (bruta - descuentos financiados por el local)
  headline_sales: gross

# Marcas. Cada marca se analiza por separado (filtro "Marca" del panel, informe y alertas propios).
brands:
  - {id: kobo,  name: "Kobo",      platforms: [justo, rappi, ubereats]}
  - {id: crust, name: "The Crust", platforms: [ubereats]}

# Sucursales (tiendas). El id es interno y no debe cambiar nunca.
# COMPLETAR los nombres reales y, en aliases, cómo aparece cada tienda en los reportes.
branches:
  - {id: KOBO1,  brand: kobo,  name: "Kobo 1",      aliases: []}
  - {id: KOBO2,  brand: kobo,  name: "Kobo 2",      aliases: []}
  - {id: KOBO3,  brand: kobo,  name: "Kobo 3",      aliases: []}
  - {id: KOBO4,  brand: kobo,  name: "Kobo 4",      aliases: []}
  - {id: KOBO5,  brand: kobo,  name: "Kobo 5",      aliases: []}
  - {id: KOBO6,  brand: kobo,  name: "Kobo 6",      aliases: []}
  - {id: CRUST1, brand: crust, name: "The Crust 1", aliases: []}
  - {id: CRUST2, brand: crust, name: "The Crust 2", aliases: []}

platforms:
  justo:
    name: "Justo"
    # Comisión contractual (0.05 = 5%). Solo se usa si el reporte NO trae la comisión
    # real; en ese caso la liquidación queda marcada como ESTIMADA. null = no estimar.
    commission_rate: null             # COMPLETAR
    sessions_definition: "COMPLETAR: fuente y definición de visitas (p.ej. GA4 sesiones en tienda Justo)"
  rappi:
    name: "Rappi"
    commission_rate: null             # COMPLETAR
    sessions_definition: "COMPLETAR: definición de 'visitas/sesiones' según el portal Rappi Partners"
  ubereats:
    name: "Uber Eats"
    commission_rate: null             # COMPLETAR
    sessions_definition: "COMPLETAR: definición según Uber Eats Manager"

# Cómo se identifica cada sucursal dentro de cada plataforma (ID de tienda externo).
# Una fila por sucursal x plataforma. Sin esto, las órdenes no se pueden asignar.
# Portales (referencia):
#   Uber Eats Manager: https://merchants.ubereats.com/manager/stores
#   Rappi Partners:    https://restaurantes.rappi.com  (una tienda conocida: storeId CL900114436 -> ¿qué sucursal Kobo?)
#   Justo admin:       https://admin.getjusto.com
store_mapping:
  - {platform: justo,    external_store_id: "COMPLETAR", branch_id: KOBO1}
  # ... repetir para KOBO1..KOBO6 en justo, rappi y ubereats, y CRUST1..CRUST2 en ubereats

# Objetivos de venta (opcionales). Si no hay objetivo, la alerta de run rate
# compara contra la venta real de la semana/mes anterior.
targets:
  weekly: {}    # ejemplo: {KOBO1: 4500000, CRUST1: 2500000}
  monthly: {}

run_rate:
  history_weeks: 8          # semanas completas usadas para el patrón por día de semana
  min_weeks_for_pattern: 3  # con menos historia se usa proyección lineal (y se avisa)

alerts:
  baseline_weeks: 4                  # "promedio" = mismo día de semana, últimas 4 semanas
  min_daily_sales_for_alert: 50000   # no alertar sobre bases diminutas (CLP)
  min_sessions_for_conversion: 50
  ticket_cv: 0.5                     # variabilidad típica del ticket (para filtrar ruido)
  sales_drop:        {red: -0.25, yellow: -0.12, green: 0.15}
  sessions_drop:     {red: -0.25, yellow: -0.12}
  conversion_drop:   {red: -0.20, yellow: -0.10}
  ticket_drop:       {red: -0.15, yellow: -0.08}
  availability:      {red: 0.85, yellow: 0.95}   # open_time / horario programado
  refunds_rate:      {red_multiple: 2.0, yellow_multiple: 1.5, red_abs: 0.03, min_amount: 15000}
  cancel_rate:       {red_multiple: 2.0, yellow_multiple: 1.5, red_abs: 0.05, min_orders: 3}
  platform_wtd:      {red: -0.15, yellow: -0.08, green: 0.10}
  run_rate_vs_goal:  {red: 0.90, yellow: 0.97, green: 1.05}
  product_missing:   {top_n: 10, min_avg_units: 2, red_avg_units: 5}
  mix_change_pp: 0.02   # cambio de participación >= 2 puntos porcentuales

notifications:
  email:
    enabled: false
    to: []          # COMPLETAR destinatarios
    send_levels: [ROJO, AMARILLO]

ai:
  model: "claude-opus-5-5"
  report_effort: "high"
  chat_effort: "medium"
