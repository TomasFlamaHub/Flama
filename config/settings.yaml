# =====================================================================
#  CENTRO DE CONTROL COMERCIAL - CONFIGURACIÓN PRINCIPAL
#  Todo lo que dice COMPLETAR debe llenarse con datos reales del negocio.
# =====================================================================

business:
  name: "Flama Hub"
  timezone: "America/Santiago"
  currency: "CLP"
  # Hora de corte del día comercial. Un pedido de las 00:40 cuenta para el día
  # anterior si el corte es a las 05:00. Así la comparación "lunes vs lunes" es homogénea.
  business_day_cutoff_hour: 5
  # Qué número se usa como "venta" principal en tarjetas y alertas:
  #   gross = venta bruta (precio de menú, antes de descuentos)
  #   net   = venta neta (bruta - descuentos financiados por el local)
  headline_sales: gross

# Marcas. Cada marca se analiza por separado (filtro "Marca" del panel, informe y alertas propios).
brands:
  - {id: kobo,  name: "Kobo",      platforms: [justo, rappi, ubereats]}
  - {id: crust, name: "The Crust", platforms: [ubereats]}

# Sucursales (tiendas). El id es interno y no debe cambiar nunca.
# COMPLETAR los nombres reales y, en aliases, cómo aparece cada tienda en los reportes.
branches:
  # Nombres según Uber Eats. Rappi y Justo usan otros nombres para 2 tiendas (ver aliases).
  # (*) Cruce Peñalolén = "Los Presidentes" y Tobalaba = "El Golf" inferido por dirección: CONFIRMAR.
  - {id: KLAREINA,  brand: kobo,  name: "La Reina",     aliases: ["Kobo Sushi - La Reina"]}
  - {id: KLASCONDES, brand: kobo, name: "Las Condes",   aliases: ["Kobo Sushi - Las Condes"]}
  - {id: KMMONTT,   brand: kobo,  name: "Manuel Montt", aliases: ["Kobo Sushi - Manuel Montt"]}
  - {id: KPENALOLEN, brand: kobo, name: "Peñalolén",    aliases: ["Kobo Sushi - Peñalolén", "Kobo Sushi - Los Presidentes", "Los Presidentes"]}
  - {id: KSANMIGUEL, brand: kobo, name: "San Miguel",   aliases: ["Kobo Sushi - San Miguel"]}
  - {id: KTOBALABA, brand: kobo,  name: "Tobalaba",     aliases: ["Kobo Sushi - Tobalaba", "Kobo Sushi - El Golf", "El Golf"]}
  - {id: CRUST1,    brand: crust, name: "The Crust 1",  aliases: []}   # COMPLETAR (cuenta Uber de The Crust)
  - {id: CRUST2,    brand: crust, name: "The Crust 2",  aliases: []}   # COMPLETAR

platforms:
  justo:
    name: "Justo"
    # Comisión contractual (0.05 = 5%). Solo se usa si el reporte NO trae la comisión
    # real; en ese caso la liquidación queda marcada como ESTIMADA. null = no estimar.
    commission_rate: null             # COMPLETAR
    sessions_definition: "Justo no tiene visitas en su admin; revisar Google Analytics en Página web > Integraciones."
  rappi:
    name: "Rappi"
    commission_rate: null             # COMPLETAR
    sessions_definition: "Rappi no exporta visitas. Solo muestra en pantalla la tasa de conversión: '% de todos los usuarios que te han visitado y finalizaron una orden'."
  ubereats:
    name: "Uber Eats"
    commission_rate: null             # COMPLETAR
    sessions_definition: "Embudo de Uber: Tienda visualizada -> Vieron el menú -> Agregaron al carrito -> Pedidos. Conversión del menú = pedidos / visualizaciones del menú. Solo por período (no diario)."

# Cómo se identifica cada sucursal dentro de cada plataforma (ID de tienda externo).
